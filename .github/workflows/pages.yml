name: Validate projects and redirect former website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-project-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run projects:validate
      - run: npm run projects:contracts
      - run: npm test
  redirect:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for restored private website
        run: |
          python3 - <<'CHECK'
          import json, time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('https://equilibriumpress.github.io/GeoLibre/publication.json', timeout=10) as response:
                      publication = json.load(response)
                  if publication.get('pagesBase') == 'https://equilibriumpress.github.io/GeoLibre/' and publication.get('repositoryUrl') == 'https://github.com/Equilibriumpress/geolibre-projects':
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Private website is not published yet; leave current public site in place')
          CHECK
      - run: python3 scripts/build-site-redirects.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deploy
